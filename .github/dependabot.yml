version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images in the Dockerfile (node, nginx-unprivileged).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node LTS (even majors, like .nvmrc); odd majors stop getting fixes after six months.
      - dependency-name: node
        update-types: [version-update:semver-major]
