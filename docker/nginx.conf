# Serves the static Astro build (dist/, copied to /srv/www) from the domain root.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/www;
    index index.html;
    charset utf-8;

    server_tokens off;
    # Relative redirects (/catalogo -> /catalogo/) keep working behind proxies and port mappings.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # nginx drops inherited add_header directives in any block that sets its own,
    # so every location below includes the security headers again.
    include /etc/nginx/snippets/security-headers.conf;

    # Pages are directories with an index.html (trailingSlash: 'always').
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fingerprinted build output (CSS, JS, fonts, optimized images) never changes.
    location /_astro/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
