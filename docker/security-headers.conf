# Security response headers. Keep them in sync with the "headers" in vercel.json.
# The main Content-Security-Policy is the <meta> tag Astro generates in every page;
# frame-ancestors only works as a header, so it is added here (clickjacking protection).
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
